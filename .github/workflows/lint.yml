name: Lint

# Catches Lua syntax errors before a release is tagged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
        with:
          args: DynamicCameraZoom --only 011 --no-color
